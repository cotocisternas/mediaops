[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/proto",
    "crates/store",
    "crates/net",
    "crates/ssh",
    "crates/arr",
    "crates/transfer",
    "crates/sync",
    "crates/encode",
    "crates/arch-tests",
    "bins/mediaops",
    "bins/mediaopsd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/cotocisternas/mediaops"
homepage = "https://github.com/cotocisternas/mediaops"
authors = ["Coto Cisternas <coto@petabyte.cl>"]

[workspace.dependencies]
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
rustls = "=0.23.43"
tokio-rustls = "=0.26.4"
rcgen = "=0.14.10"
blake3 = "=1.8.7"
clap = "=4.6.6"
rusqlite = "=0.40.2"
tokio = { version = "=1.53.1", default-features = false }
reqwest = { version = "=0.13.4", default-features = false }
serde = "=1.0.229"
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
similar = "=3.2.0"
serde_json = "=1.0.151"
cargo_metadata = "=0.23.1"
directories = "=6.0.0"
fs4 = "=1.1.0"
sha2 = "=0.10.9"
libc = "=0.2.189"
tokio-stream = { version = "=0.1.19", default-features = false }
tower = { version = "=0.5.3", default-features = false }
http = { version = "=1.5.0", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
rustls-pki-types = "=1.15.1"

mediaops-core = { path = "crates/core" }
mediaops-proto = { path = "crates/proto" }
mediaops-store = { path = "crates/store" }
mediaops-net = { path = "crates/net" }
mediaops-ssh = { path = "crates/ssh" }
mediaops-arr = { path = "crates/arr" }
mediaops-transfer = { path = "crates/transfer" }
mediaops-sync = { path = "crates/sync" }
mediaops-encode = { path = "crates/encode" }
