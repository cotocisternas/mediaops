[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/proto",
    "crates/store",
    "crates/net",
    "crates/ssh",
    "crates/arr",
    "crates/transfer",
    "crates/sync",
    "crates/encode",
    "crates/arch-tests",
    "bins/mediaops",
    "bins/mediaopsd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
rustls = "=0.23.43"
tokio-rustls = "=0.26.4"
rcgen = "=0.14.10"
blake3 = "=1.8.7"
clap = "=4.6.6"
rusqlite = "=0.40.2"
tokio = { version = "=1.53.1", default-features = false }
reqwest = "=0.13.4"
serde = "=1.0.229"
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
similar = "=3.2.0"
serde_json = "=1.0.151"
cargo_metadata = "=0.23.1"
directories = "=6.0.0"
fs4 = "=1.1.0"

mediaops-core = { path = "crates/core" }
mediaops-proto = { path = "crates/proto" }
mediaops-store = { path = "crates/store" }
mediaops-net = { path = "crates/net" }
mediaops-ssh = { path = "crates/ssh" }
mediaops-arr = { path = "crates/arr" }
mediaops-transfer = { path = "crates/transfer" }
mediaops-sync = { path = "crates/sync" }
mediaops-encode = { path = "crates/encode" }
