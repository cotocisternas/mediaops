[package]
name = "mediaops-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mediaops-core.workspace = true
mediaops-net.workspace = true
mediaops-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = false, features = ["fs", "io-util", "macros", "rt", "sync"] }
tonic = { workspace = true, default-features = false, features = ["codegen", "transport"] }

[dev-dependencies]
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread"] }
