[package]
name = "mediaops-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
http.workspace = true
mediaops-core.workspace = true
mediaops-proto.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["codegen", "router", "transport", "tls-aws-lc"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread", "net", "time"] }
