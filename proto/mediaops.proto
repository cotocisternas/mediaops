syntax = "proto3";

package mediaops.v1;

message RemoteRef {
  string root_id = 1;
  string rel_path = 2;
}

message RemoteEntry {
  RemoteRef ref = 1;
  uint64 len = 2;
  int64 mtime = 3;
  uint64 nlink = 4;
}

message ErrorDetail {
  int32 exit_code = 1;
  string reason = 2;
  string message = 3;
}

service Transfer {
  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc GetRange(GetRangeRequest) returns (stream GetRangeResponse);
}

message ListRequest {}

message ListResponse {
  repeated RemoteEntry entries = 1;
}

message StatRequest {
  RemoteRef ref = 1;
}

message StatResponse {
  RemoteEntry entry = 1;
}

message GetRangeRequest {
  RemoteRef ref = 1;
  uint64 offset = 2;
  uint64 len = 3;
}

message GetRangeResponse {
  bytes data = 1;
}

service Control {
  rpc Df(DfRequest) returns (DfResponse);
  rpc Unmonitor(UnmonitorRequest) returns (UnmonitorResponse);
  rpc DeleteRemote(DeleteRemoteRequest) returns (DeleteRemoteResponse);
  rpc GrabApply(GrabApplyRequest) returns (GrabApplyResponse);
  rpc EdgeCheck(EdgeCheckRequest) returns (EdgeCheckResponse);
  rpc EdgeApply(EdgeApplyRequest) returns (EdgeApplyResponse);
  rpc KeyDiscovery(KeyDiscoveryRequest) returns (KeyDiscoveryResponse);
  rpc GuardPreview(GuardPreviewRequest) returns (GuardPreviewResponse);
  rpc HoldList(HoldListRequest) returns (HoldListResponse);
  rpc HoldReject(HoldRejectRequest) returns (HoldRejectResponse);
}

// Home UDS only. Seedbox mediaopsd does not serve this.
service Gateway {
  rpc ConfigurePool(ConfigurePoolRequest) returns (ConfigurePoolResponse);
  rpc PoolStatus(PoolStatusRequest) returns (PoolStatusResponse);
  rpc ProbeRange(ProbeRangeRequest) returns (ProbeRangeResponse);
}

message ConfigurePoolRequest {
  uint32 n = 1;
}

message ConfigurePoolResponse {
  uint32 n = 1;
}

message PoolStatusRequest {}

message PoolStatusResponse {
  string endpoint_fingerprint = 1;
  uint32 n = 2;
}

message ProbeRangeRequest {
  uint32 max_n = 1;
}

message ProbeRangeResponse {
  uint32 n = 1;
}

message DfRequest {}

message DfResponse {
  string semver = 1;
  string proto_package = 2;
  uint64 free_bytes = 3;
}

message UnmonitorRequest {
  string title_id = 1;
}

message UnmonitorResponse {
  string semver = 1;
  string proto_package = 2;
}

message DeleteRemoteRequest {
  RemoteRef ref = 1;
}

enum DeleteRemoteResult {
  DELETE_REMOTE_RESULT_UNSPECIFIED = 0;
  DELETED = 1;
  SKIPPED_SEEDING = 2;
}

message DeleteRemoteResponse {
  string semver = 1;
  string proto_package = 2;
  DeleteRemoteResult result = 3;
}

message GrabApplyRequest {
  bytes desired_state_toml = 1;
}

message GrabApplyResponse {
  string semver = 1;
  string proto_package = 2;
  bool noop = 3;
  string diff = 4;
}

message EdgeCheckRequest {}

message EdgeCheckResponse {
  string semver = 1;
  string proto_package = 2;
  string fingerprint = 3;
  bool invariant_ok = 4;
  string drift = 5;
}

message EdgeApplyRequest {
  bytes desired_state_toml = 1;
}

message EdgeApplyResponse {
  string semver = 1;
  string proto_package = 2;
  bool noop = 3;
  string diff = 4;
}

message KeyDiscoveryRequest {}

message KeyDiscoveryResponse {
  string semver = 1;
  string proto_package = 2;
  bool sonarr_key_present = 3;
  bool radarr_key_present = 4;
  bool lidarr_key_present = 5;
  bool prowlarr_key_present = 6;
  bool sab_key_present = 7;
  bool qbit_key_present = 8;
}

message GuardPreviewRequest {}

message GuardPreviewResponse {
  string semver = 1;
  string proto_package = 2;
}

message HoldListRequest {}

message HoldLiveItem {
  string title_id = 1;
  string release_id = 2;
  int64 added_unix = 3;
  uint64 size = 4;
  string reason = 5;
  RemoteRef remote = 6;
  Placement placement = 7;
}

message HoldListResponse {
  string semver = 1;
  string proto_package = 2;
  repeated HoldLiveItem items = 3;
}

message HoldRejectRequest {
  string title_id = 1;
  string release_id = 2;
}

message HoldRejectResponse {
  string semver = 1;
  string proto_package = 2;
}

message Placement {
  oneof kind {
    MoviePlacement movie = 1;
    EpisodePlacement episode = 2;
    TrackPlacement track = 3;
  }
}

message MoviePlacement {
  string title = 1;
  uint32 year = 2;
  string extension = 3;
}

message EpisodePlacement {
  string title = 1;
  uint32 year = 2;
  uint32 season = 3;
  uint32 episode = 4;
  string extension = 5;
}

message TrackPlacement {
  string album = 1;
  uint32 year = 2;
  uint32 track = 3;
  string title = 4;
  string extension = 5;
}
