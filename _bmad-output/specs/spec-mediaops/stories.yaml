- id: "13"
  title: First demo on this box
  description: >-
    Live integration per increments.md: bootstrap both ends, plan, pull
    with parallel ranges, kill at ~90% and resume from .partial, schema
    install, then encode one HEVC-MP4 movie under the NVENC cap; produce
    the demo runbook. Live-box and GPU work — explicitly not CI (AD-20's
    feature-gated path).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    This story runs against the live SeedIt4Me box and the home GPU —
    stop and surface anything destructive before executing it. Keep all
    live steps behind the explicit cargo feature + env var per AD-20.
