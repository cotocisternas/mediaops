    bytes plus blake3 hash; core::jobs state machines with advance() as
    the sole state write; the store crate with migrations and the four
    repositories (AD-8, AD-9, AD-10).
  invoke_dev_with: >-
    Offline tests only (AD-20); the live box and GPU are story 13's domain.
    Obey arch-tests; cite AD IDs in code comments only where non-obvious.
