- id: "6"
  title: mediaopsd seedbox role
  description: >-
    Seedbox role binding TCP gRPC+mTLS: the Transfer service (listing,
    Stat, streaming GetRange) backed by the one walker, and minimal
    Control (df, version + proto-package handshake). grabber=None only —
    no arr crate in this story set (AD-5, AD-22, CAP-5 slice).
  invoke_dev_with: >-
    Offline tests only (AD-20); the live box and GPU are story 13's domain.
    Obey arch-tests; cite AD IDs in code comments only where non-obvious.
- id: "7"
  title: Seedbox bootstrap over ssh
  description: >-
    mediaops seedbox bootstrap: import ~/.ssh/config Host seedbox, build
    musl-static mediaopsd, copy binary and systemd user unit, mint and
    place certs, config-home layout with git-work-tree refusals, then
    probe Range concurrency and persist N keyed by endpoint_fingerprint
    (AD-7, AD-16, AD-22, CAP-5).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Offline tests only (AD-20); unit-test the bootstrap via exec-port
    transcripts. This story's code touches the live SeedIt4Me box when
    run — stop and surface anything destructive before executing it.
- id: "8"
  title: Home gateway
  description: >-
    Home mediaopsd role: re-serve the seedbox services on the unix
    socket, proxy Control and Range streams byte-for-byte, ConfigurePool
    with 1:1 stream-to-channel pinning and ResourceExhausted refusal of
    the N+1th stream, and the status RPC exposing endpoint_fingerprint
    (AD-4, AD-12).
  invoke_dev_with: >-
    Offline tests only (AD-20); the live box and GPU are story 13's domain.
    Obey arch-tests; cite AD IDs in code comments only where non-obvious.
    Include the AD-12 failure-history test: N concurrent streams must
    produce N distinct upstream connections.
