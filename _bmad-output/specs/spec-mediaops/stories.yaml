- id: "1"
  title: Workspace scaffold and dependency law
  description: >-
    Cargo workspace with all crate and binary skeletons from the spine's
    structural seed, plus the arch-tests member crate enforcing AD-2's
    dependency subgraph and bans. Lands the core ExitCode enum, the
    stdout/stderr + --json envelope convention, and tracing setup
    (AD-1, AD-2, AD-17, AD-18, AD-19).
  invoke_dev_with: >-
    Offline tests only (AD-20); the live box and GPU are story 13's domain.
    Obey arch-tests; cite AD IDs in code comments only where non-obvious.
- id: "2"
