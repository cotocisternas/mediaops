    core::pathschema with parse(render(id)) == id round-trip, scene-tag
    strip and reject bins as schema CI, the TitleId kind:source:id form,
    the allowlist walker that never follows symlinks off-root, and
    staging_path (AD-13, CAP-6 groundwork).
  invoke_dev_with: >-
    Offline tests only (AD-20); the live box and GPU are story 13's domain.
    Obey arch-tests; cite AD IDs in code comments only where non-obvious.
