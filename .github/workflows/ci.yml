name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Install protobuf compiler, musl, cmake
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools cmake
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Test workspace
        run: cargo test --locked --offline --workspace
      - name: Musl-static mediaopsd
        run: make musl OFFLINE=1
      - name: mediaopsd is statically linked
        run: |
          bin=target/x86_64-unknown-linux-musl/release/mediaopsd
          out=$(file "$bin")
          echo "$out"
          # Ubuntu's file(1) reports musl +crt-static as "static-pie linked".
          echo "$out" | grep -Eq 'statically linked|static-pie linked'
