[package]
name = "mediaops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
fs4.workspace = true
mediaops-core.workspace = true
mediaops-encode.workspace = true
mediaops-ssh.workspace = true
mediaops-store.workspace = true
mediaops-sync.workspace = true
mediaops-transfer.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = false, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }

[features]
default = []
live-box = []

[dev-dependencies]
fs4.workspace = true
serde_json.workspace = true
